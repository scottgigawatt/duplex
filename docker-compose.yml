# docker-compose.yml: Run Duplex's Plex metadata, maintenance, monitoring, and
#                     notification services on Docker Compose or Synology DSM.
#
# Services included:
#   - Kometa:      https://kometa.wiki
#   - ImageMaid:   https://kometa.wiki/en/latest/kometa/scripts/imagemaid/
#   - PATTRMM:     https://github.com/InsertDisc/pattrmm
#   - Tautulli:    https://docs.tautulli.com
#   - Notifiarr:   https://notifiarr.wiki
#   - Watchtower:  https://watchtower.nickfedor.com
#

#
# Setup default properties shared by every service.
#
x-default-container: &default-container  # YAML anchor for common container settings
  pull_policy: always                    # Check the registry before every deployment
  restart: unless-stopped                # Restart unless an operator stops the container
  logging:                               # Bound local JSON log growth
    driver: "json-file"                  # Use Docker's JSON file logging driver
    options:                             # Logging options for the JSON file driver
      max-size: ${LOG_MAX_SIZE}          # Maximum size of each rotated log file
      max-file: ${LOG_MAX_FILE}          # Number of rotated log files to retain

#
# Setup the timezone shared by every service.
#
x-default-environment: &default-environment  # YAML anchor for shared environment values
  TZ: ${TZ}                                  # IANA timezone used by scheduled services

#
# Mark services that Watchtower may update.
#
x-enable-watchtower: &enable-watchtower           # YAML anchor for opt-in update labels
  - "com.centurylinklabs.watchtower.enable=true"  # Allow this service to be updated

#
# Mark infrastructure that must never update itself.
#
x-disable-watchtower: &disable-watchtower          # YAML anchor for opt-out update labels
  - "com.centurylinklabs.watchtower.enable=false"  # Require an intentional update

#
# Define the Duplex service stack.
#
services:
  #
  # Manage Plex metadata, collections, overlays, and playlists.
  #
  kometa:
    <<: *default-container  # Pull in common container settings
    image: ${KOMETA_IMAGE}  # Versioned official Kometa image
    container_name: kometa  # Stable name used by operators and integrations
    hostname: kometa        # Stable hostname inside the Compose network

    labels: *enable-watchtower  # Permit reviewed tag rebuilds to roll forward

    environment:
      <<: *default-environment       # Pull in the shared timezone
      KOMETA_DEBUG: ${KOMETA_DEBUG}  # Enable additional diagnostic output
      KOMETA_TIMES: ${KOMETA_TIMES}  # Daily schedule in Kometa's time-list format

    volumes:
      - "${HOST_DUPLEX_CONFIG}/kometa:/config:rw"  # Kometa config, cache, and logs

  #
  # Clean Plex's image cache on the configured maintenance schedule.
  #
  imagemaid:
    <<: *default-container     # Pull in common container settings
    image: ${IMAGEMAID_IMAGE}  # Versioned official ImageMaid image
    container_name: imagemaid  # Stable name used by operators and integrations
    hostname: imagemaid        # Stable hostname inside the Compose network

    labels: *enable-watchtower  # Permit reviewed tag rebuilds to roll forward

    environment:
      <<: *default-environment  # Pull in the shared timezone

    volumes:
      - "${HOST_DUPLEX_CONFIG}/imagemaid:/config:rw"  # ImageMaid settings and logs
      - "${HOST_PLEX_CONFIG}:/plex:rw"                # Plex image cache and database

  #
  # Generate Returning Soon and In-History metadata for Kometa.
  #
  pattrmm:
    <<: *default-container   # Pull in common container settings
    image: ${PATTRMM_IMAGE}  # Digest-pinned upstream image; no versioned tags exist
    container_name: pattrmm  # Stable name used by operators and integrations
    hostname: pattrmm        # Stable hostname inside the Compose network

    labels: *disable-watchtower  # Renovate owns the pinned PATTRMM image digest

    environment:
      <<: *default-environment       # Pull in the shared timezone
      PATTRMM_TIME: ${PATTRMM_TIME}  # Daily scheduled run time in 24-hour format
      PUID: ${PATTRMM_PUID}          # Host user ID for generated files
      GUID: ${PATTRMM_PGID}          # Upstream variable name for the host group ID

    volumes:
      - "${HOST_DUPLEX_CONFIG}/pattrmm/data:/data:rw"                # Runtime history and cache
      - "${HOST_DUPLEX_CONFIG}/pattrmm/preferences:/preferences:rw"  # PATTRMM settings
      - "${HOST_DUPLEX_CONFIG}/kometa:/config:rw"                    # Generated Kometa metadata

  #
  # Monitor Plex activity and expose the Tautulli web interface.
  #
  tautulli:
    <<: *default-container    # Pull in common container settings
    image: ${TAUTULLI_IMAGE}  # Versioned official Tautulli image
    container_name: tautulli  # Stable name used by operators and integrations
    hostname: tautulli        # Stable hostname inside the Compose network

    labels: *enable-watchtower  # Permit reviewed tag rebuilds to roll forward

    environment:
      <<: *default-environment  # Pull in the shared timezone
      PUID: ${TAUTULLI_PUID}    # Host user ID for Tautulli state
      PGID: ${TAUTULLI_PGID}    # Host group ID for Tautulli state

    ports:
      - "${TAUTULLI_PORT}:8181"  # Tautulli web interface

    volumes:
      - "${HOST_DUPLEX_CONFIG}/tautulli:/config:rw"  # Database, settings, and logs

  #
  # Send service notifications and expose the Notifiarr client interface.
  #
  notifiarr:
    <<: *default-container     # Pull in common container settings
    image: ${NOTIFIARR_IMAGE}  # Versioned official Notifiarr image
    container_name: notifiarr  # Stable name used by operators and integrations
    hostname: notifiarr        # Required to keep one stable Notifiarr client identity

    labels: *enable-watchtower  # Permit reviewed tag rebuilds to roll forward

    environment:
      <<: *default-environment  # Pull in the shared timezone

    ports:
      - "${NOTIFIARR_PORT}:5454"  # Notifiarr web interface and webhook endpoint

    volumes:
      - "${HOST_DUPLEX_CONFIG}/notifiarr:/config:rw"  # Generated Notifiarr client config
      - "/var/run/utmp:/var/run/utmp:ro"              # Logged-in user count
      - "/etc/machine-id:/etc/machine-id:ro"          # Stable host identity

  #
  # Update only containers that explicitly opt in with a Watchtower label.
  #
  watchtower:
    <<: *default-container      # Pull in common container settings
    image: ${WATCHTOWER_IMAGE}  # Maintained community Watchtower image
    container_name: watchtower  # Stable name used by operators and integrations
    hostname: watchtower        # Stable hostname inside the Compose network

    labels: *disable-watchtower  # Prevent the updater from replacing itself

    environment:
      <<: *default-environment                                     # Pull in the shared timezone
      DOCKER_CONFIG: /config                                       # Directory containing registry credentials
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL}        # Seconds between registry checks
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP}                    # Remove superseded images
      WATCHTOWER_INCLUDE_STOPPED: ${WATCHTOWER_INCLUDE_STOPPED}    # Inspect stopped labeled containers
      WATCHTOWER_REVIVE_STOPPED: ${WATCHTOWER_REVIVE_STOPPED}      # Restart updated stopped containers
      WATCHTOWER_LABEL_ENABLE: ${WATCHTOWER_LABEL_ENABLE}          # Ignore containers without an opt-in label
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS}        # Notification backend
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}  # Notification destination

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"  # Docker daemon control socket
      - "${WATCHTOWER_DOCKER_CONFIG}:/config:ro"        # Registry credentials directory

#
# Define the isolated Duplex network.
#
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}  # Stable network name shared with optional tools
    ipam:
      driver: default  # Use Docker's default IP address management driver
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET}      # Address space reserved for Duplex
          ip_range: ${COMPOSE_NETWORK_IP_RANGE}  # Addresses assigned to containers
          gateway: ${COMPOSE_NETWORK_GATEWAY}    # Gateway inside the reserved subnet
