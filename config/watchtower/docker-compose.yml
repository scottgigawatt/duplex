# docker-compose.yml: Run one Watchtower update pass against containers that
#                     explicitly opt in with the Watchtower enable label.
#
# Documentation: https://watchtower.nickfedor.com
#

#
# Setup common one-shot container properties.
#
x-default-container: &default-container  # YAML anchor for common container settings
  pull_policy: always                    # Check the registry before every run
  restart: "no"                          # Exit after the requested update pass
  logging:                               # Bound local JSON log growth
    driver: "json-file"                  # Use Docker's JSON file logging driver
    options:
      max-size: ${LOG_MAX_SIZE}          # Maximum size of each rotated log file
      max-file: ${LOG_MAX_FILE}          # Number of rotated log files to retain

#
# Define the one-shot Watchtower service.
#
services:
  watchtower-run:
    <<: *default-container         # Pull in common one-shot settings
    image: ${WATCHTOWER_IMAGE}     # Maintained community Watchtower image
    container_name: watchtower-run  # Stable name used by operators
    hostname: watchtower-run        # Stable hostname inside the container

    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Never update this one-shot container

    environment:
      TZ: ${TZ}                                                    # IANA timezone used in logs
      DOCKER_CONFIG: /config                                       # Directory containing registry credentials
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP}                    # Remove superseded images
      WATCHTOWER_INCLUDE_STOPPED: ${WATCHTOWER_INCLUDE_STOPPED}    # Inspect stopped labeled containers
      WATCHTOWER_REVIVE_STOPPED: ${WATCHTOWER_REVIVE_STOPPED}      # Restart updated stopped containers
      WATCHTOWER_LABEL_ENABLE: ${WATCHTOWER_LABEL_ENABLE}          # Ignore containers without an opt-in label
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS}        # Notification backend
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}  # Notification destination
      WATCHTOWER_RUN_ONCE: ${WATCHTOWER_RUN_ONCE}                  # Run one update pass and exit

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"  # Docker daemon control socket
      - "${WATCHTOWER_DOCKER_CONFIG}:/config:ro"        # Registry credentials directory
