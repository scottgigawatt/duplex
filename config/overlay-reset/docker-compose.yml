# docker-compose.yml: Run the destructive Kometa Overlay Reset recovery tool as
#                     a one-shot container with configuration under /config.
#
# Documentation: https://kometa.wiki/en/latest/kometa/scripts/overlay-reset/
#

#
# Setup common one-shot container properties.
#
x-default-container: &default-container  # YAML anchor for common container settings
  pull_policy: always                    # Check the registry before every run
  restart: "no"                          # Never repeat a destructive recovery automatically
  logging:                               # Bound local JSON log growth
    driver: "json-file"                  # Use Docker's JSON file logging driver
    options:
      max-size: ${LOG_MAX_SIZE}          # Maximum size of each rotated log file
      max-file: ${LOG_MAX_FILE}          # Number of rotated log files to retain

#
# Define the one-shot Overlay Reset service.
#
services:
  overlay-reset:
    <<: *default-container          # Pull in common one-shot settings
    image: ${OVERLAY_RESET_IMAGE}   # Versioned official Overlay Reset image
    container_name: overlay-reset   # Stable name used by operators
    hostname: overlay-reset         # Stable hostname inside the Compose network

    environment:
      TZ: ${TZ}  # IANA timezone used in logs and scheduled expressions

    volumes:
      - "${HOST_OVERLAY_RESET_CONFIG}:/config:rw"  # Settings, state, and recovery logs
